; =============================================================
; PlatformIO Project Configuration
; Project  : ESP32 Home Automation – Smart Temperature Monitor
; Board    : ESP32 DevKit v1 (any ESP32 WiFi+BT module)
; Sensor   : DHT11 on GPIO 4 (DATA pin)
; =============================================================

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

; ---- Upload & Monitor ----------------------------------------
upload_speed  = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, default

; ---- File-system: LittleFS -----------------------------------
; Run  "pio run --target uploadfs"  to push the data/ folder.
board_build.filesystem = littlefs

; ---- Library dependencies ------------------------------------
; NOTE: We use the esphome-maintained forks of ESPAsyncWebServer and AsyncTCP
; instead of the original me-no-dev libraries.  The me-no-dev v1.x fork defines
; HTTP_GET / HTTP_POST / … as global enum values (WebRequestMethod) which
; conflicts with the identically-named enum in the ESP-IDF nghttp http_parser.h
; that is pulled in by WiFiManager → WebServer.h → HTTP_Method.h on
; espressif32 7.x / Arduino-ESP32 3.x.  The esphome forks keep API compatibility,
; but the enum collision still occurs if ESPAsyncWebServer and WiFiManager are
; included in the same translation unit.  This project isolates WiFiManager in
; src/WifiPortal.cpp to keep those headers apart at compile time.
lib_deps =
    ; DHT11/DHT22 sensor driver
    adafruit/DHT sensor library @ ^1.4.6
    ; Adafruit unified sensor abstraction layer (required by DHT lib)
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    ; Async HTTP web server – esphome fork (compatible with espressif32 7.x)
    esphome/ESPAsyncWebServer-esphome @ >=3.0.0
    ; Async TCP layer – esphome fork (required by ESPAsyncWebServer-esphome)
    esphome/AsyncTCP-esphome @ >=2.0.0
    ; JSON serialisation/deserialisation
    bblanchon/ArduinoJson @ ^7.0.0
    ; WiFiManager – captive-portal Wi-Fi provisioning
    tzapu/WiFiManager @ ^2.0.17-beta

; ---- Build flags ---------------------------------------------
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM
    ; Suppress noisy deprecation warnings from third-party libs
    -Wno-deprecated-declarations
